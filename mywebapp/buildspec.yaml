version: 0.2

phases:
  install:
    commands:
      - echo Installing dependencies...
      - npm ci --prefix mywebapp
  build:
    commands:
      - echo Build started on `date`
      - npm run build --prefix mywebapp
      - npm run export --prefix mywebapp
artifacts:
  base-directory: mywebapp/out
  files:
    - '**/*'
