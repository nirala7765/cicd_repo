version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo Installing dependencies...
      - cd mywebapp
      - npm ci   # or npm install

  build:
    commands:
      - echo Build started on `date`
      - cd mywebapp
      - npm run build

artifacts:
  files:
    - '**/*'
  base-directory: mywebapp/out
